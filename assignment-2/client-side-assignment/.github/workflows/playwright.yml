name: Playwright Tests
on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - name: Checkout frontend
      uses: actions/checkout@v4
      with:
        path: client-side-assignment

    - name: Checkout backend
      uses: actions/checkout@v4
      with:
        repository: pinchas0537/server-side-assignment
        path: server-side-assignment
        token: ${{ secrets.GH_TOKEN }}
        ref: Docker

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Create .env file
      working-directory: server-side-assignment
      run: |
        echo "MONGO_URI_DOCKER=${{ secrets.MONGO_URI_DOCKER }}" >> .env
        echo "PORT=${{ secrets.PORT }}" >> .env
        echo "MONGO_PORT=${{ secrets.MONGO_PORT }}" >> .env
        echo "MONGOE_EXPRESS_PORT=${{ secrets.MONGOE_EXPRESS_PORT }}" >> .env
        echo "CLIENT_PORT=${{ secrets.CLIENT_PORT }}" >> .env

    - name: Start Docker Compose (backend + db only)
      working-directory: server-side-assignment
      run: docker compose up -d --build backend db

    - name: Check containers status
      run: docker ps -a

    - name: Wait for backend
      run: npx wait-on tcp:localhost:${{ secrets.PORT }} --timeout 120000

    - name: Install frontend dependencies
      working-directory: client-side-assignment
      run: npm install

    - name: Start frontend
      working-directory: client-side-assignment
      env:
        VITE_API_URL: ${{ secrets.VITE_API_URL }}
      run: npm run dev &

    - name: Wait for frontend
      run: npx wait-on tcp:localhost:${{ secrets.CLIENT_PORT }} --timeout 60000

    - name: Install Playwright Browsers
      working-directory: client-side-assignment
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      working-directory: client-side-assignment
      run: npx playwright test

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: client-side-assignment/playwright-report/
        retention-days: 30
